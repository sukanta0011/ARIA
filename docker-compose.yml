services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=agent_db
      - POSTGRES_PASSWORD=agent_db
      - POSTGRES_DB=agentic_ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine

  worker:
    build: .
    command: uv run celery -A src.workers.celery_app worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://agent_db:agent_db@db/agentic_ai_db
      - REDIS_URL=redis://redis
    depends_on:
      - db
      - redis
  
  api:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://agent_db:agent_db@db/agentic_ai_db
      - REDIS_URL=redis://redis
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  